<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- page-meta -->
    <!-- Replaced per page by pages.ts in the build. -->
    <title>Embed Generator | Discord embeds without the hassle</title>
    <!-- /page-meta -->
    <meta property="og:type" content="website" />
    <!-- The site's social card. summary_large_image is what makes Discord show it big. -->
    <meta property="og:image" content="https://message.style/img/og.png" />
    <meta name="twitter:image" content="https://message.style/img/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:site_name" content="message.style" />
    <!-- pages.ts puts a heading and text in #root for crawlers that don't run JS.
         Hide it so it doesn't flash before the app mounts and replaces it. -->
    <!-- Applies the light theme before the app loads so it doesn't flash dark.
         util/theme.ts keeps it in sync afterwards. -->
    <script>
      (() => {
        try {
          const theme = JSON.parse(localStorage.getItem("settings")).state
            .theme;
          if (
            theme === "light" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: light)").matches)
          ) {
            document.documentElement.classList.add("light");
            document.documentElement.style.colorScheme = "light";
          }
        } catch {}
      })();
    </script>
    <style>
      #root > main {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
